name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  evals:
    # Real model calls cost money: only when the agent or its evals change (ADR 0001 Q9).
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          if git diff --name-only "$base" HEAD | grep -qE '^(src/agent/|evals/)'; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile && pnpm evals
        env:
          DATABASE_URL: postgres://unused:unused@localhost:5432/unused
          BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
          BETTER_AUTH_URL: http://localhost:3000
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_PRIMARY: ${{ vars.MODEL_PRIMARY }}
          MODEL_FALLBACK: ${{ vars.MODEL_FALLBACK }}
          MODEL_PREMIUM: ${{ vars.MODEL_PREMIUM }}
          MODEL_CHEAP: ${{ vars.MODEL_CHEAP }}
      - if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with: { name: eval-report, path: evals/reports/latest.json }
